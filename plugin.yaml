# Plugin manifest — keep in sync with OrganizationPlugin.kt (backend).
id: organization
name: "Organization"
kind: feature
version: 0.1.0
# Where this repo lives as a submodule inside the main repo (PEI-aLinha/alinha)
path: plugins/feature/organization
publishes: [OrganizationRegistered]     # events it publishes
consumes: []      # events it consumes
permissions:      # RBAC resources; role mapping lives in OrganizationPlugin.kt
  - organization:register   # registrant: create the organization (ADR 0004)
  - organization:read       # responsible, consultant, analyst
  - organization:edit       # responsible, consultant
nav:              # menu entries; GET /api/plugins shows each one only to roles with its permission
  - label: "Organização"
    path: organization
    area: client
    permission: organization:read
